<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Blue Gradient -->
    <linearGradient id="logoBlue" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#0052d4" />
      <stop offset="50%" stop-color="#00359a" />
      <stop offset="100%" stop-color="#001849" />
    </linearGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="logoGold" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffe682" />
      <stop offset="40%" stop-color="#e5b018" />
      <stop offset="75%" stop-color="#b7860d" />
      <stop offset="100%" stop-color="#7e5a00" />
    </linearGradient>

    <!-- Glossy Highlight Gradient for Blue swoosh -->
    <linearGradient id="blueHighlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3385ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0052d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00359a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Blue Swoosh -->
  <path d="M 58,11 C 28,11 7,30 7,53 C 7,72 21,87 40,91 C 55,94 70,89 79,80 C 82,77 80,74 76,76 C 66,81 53,83 42,79 C 28,74 19,61 19,46 C 19,32 30,20 45,18 C 50,17 53,15 45,11 Z" fill="url(#logoBlue)" />
  
  <!-- Right Gold Swoosh -->
  <path d="M 52,7 C 74,10 93,29 93,52 C 93,70 80,84 65,90 C 61,92 59,88 62,85 C 73,78 81,66 81,51 C 81,35 70,20 55,18 C 49,17 46,14 52,7 Z" fill="url(#logoGold)" />

  <!-- Gold Cross -->
  <path d="M 46,15 H 54 V 22 H 61 V 30 H 54 V 37 H 46 V 30 H 39 V 22 H 46 Z" fill="url(#logoGold)" />

  <!-- Left Adult Figure -->
  <circle cx="36" cy="42" r="5" fill="url(#logoBlue)" />
  <path d="M 33,48 C 29,50 24,56 24,63 C 24,66 27,67 28,65 C 30,61 33,56 37,52 C 38,51 37,49 33,48 Z" fill="url(#logoBlue)" />
  <path d="M 35,48 C 32,50 31,57 31,65 C 31,71 35,75 39,77 C 40,78 41,76 40,74 C 38,68 36,60 37,49 C 37,48 36,48 35,48 Z" fill="url(#logoBlue)" />

  <!-- Right Adult Figure -->
  <circle cx="64" cy="42" r="5" fill="url(#logoBlue)" />
  <path d="M 67,48 C 71,50 76,56 76,63 C 76,66 73,67 72,65 C 70,61 67,56 63,52 C 62,51 63,49 67,48 Z" fill="url(#logoBlue)" />
  <path d="M 65,48 C 68,50 69,57 69,65 C 69,71 65,75 61,77 C 60,78 59,76 60,74 C 62,68 64,60 63,49 C 63,48 64,48 65,48 Z" fill="url(#logoBlue)" />

  <!-- Center Child Figure -->
  <circle cx="50" cy="53" r="3.8" fill="url(#logoBlue)" />
  <path d="M 50,59 C 47,59 45,63 45,69 C 45,74 48,77 50,78 C 52,78 55,74 55,69 C 55,63 53,59 50,59 Z" fill="url(#logoBlue)" />
  <path d="M 49,59 C 46,60 43,62 41,66 C 40,68 42,69 43,68 C 45,66 47,63 49,60 C 49,59 49,59 49,59 Z" fill="url(#logoBlue)" />
  <path d="M 51,59 C 54,60 57,62 59,66 C 60,68 58,69 57,68 C 55,66 53,63 51,60 C 51,59 51,59 51,59 Z" fill="url(#logoBlue)" />
</svg>
